<p-card styleClass="page-card tabbed-card">
    <div class="cards-toolbar">
        <p-button [label]="'cards-transfer.import' | translate" icon="pi pi-upload" severity="secondary" [text]="true"
            size="small" (onClick)="importVisible = true" />
        <p-button [label]="'cards-transfer.export-csv' | translate" icon="pi pi-file-excel" severity="secondary"
            [text]="true" size="small" (onClick)="export('csv')" />
        <p-button [label]="'cards-transfer.export-json' | translate" icon="pi pi-code" severity="secondary"
            [text]="true" size="small" (onClick)="export('json')" />
    </div>
    @if (showSheet()) {
        <app-entity-spreadsheet></app-entity-spreadsheet>
    }
</p-card>
<app-card-import-dialog [(visible)]="importVisible" [deckId]="deckId" (imported)="reload()" />
