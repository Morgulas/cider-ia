server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # index.html jamais mis en cache : les mises à jour sont prises en compte immédiatement
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fichiers générés par Angular (noms avec hash) : cache long
    location ~* \.(js|css|woff2?|ttf|wasm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Application monopage : toute route inconnue renvoie vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
