# En-têtes de sécurité, inclus dans chaque bloc location de nginx.conf
# (nginx n'hérite pas des add_header du bloc server dès qu'un location en déclare).
#
# Content-Security-Policy : les scripts ne peuvent venir que de ce serveur.
#  - 'unsafe-eval'      : Handlebars compile les modèles de cartes avec new Function
#  - 'wasm-unsafe-eval' : moteur cider-press (WebAssembly)
#  - styles, images, polices et requêtes en https: autorisés, car les modèles et
#    les documents de style peuvent charger des polices (Google Fonts) ou des images externes
#  - blob: et data: : assets du projet (URL.createObjectURL) et workers de l'éditeur Monaco
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' data: blob: https:; worker-src 'self' blob: data:; object-src 'none'; frame-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
