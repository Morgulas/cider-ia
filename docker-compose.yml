services:
  # Interface web (fichiers statiques servis par nginx) ; relaie /api vers le service api
  web:
    # image construite par GitHub à chaque mise à jour de main (voir docker/README.md)
    image: ghcr.io/morgulas/cider-ia-web:${CIDER_VERSION:-latest}
    pull_policy: always
    container_name: cider-ia-web
    restart: unless-stopped
    ports:
      - "${CIDER_PORT:-8080}:80"
    environment:
      # taille maximale d'un projet (images comprises), en Mo : même valeur que pour api
      CIDER_MAX_PROJECT_MB: ${CIDER_MAX_PROJECT_MB:-200}
    depends_on:
      api:
        condition: service_healthy

  # Serveur : comptes utilisateurs et projets
  api:
    image: ghcr.io/morgulas/cider-ia-api:${CIDER_VERSION:-latest}
    pull_policy: always
    container_name: cider-ia-api
    restart: unless-stopped
    environment:
      # utilisateur propriétaire des fichiers de données sur l'hôte (id -u / id -g)
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # durée de vie d'une session sans utilisation, en jours
      CIDER_SESSION_DAYS: ${CIDER_SESSION_DAYS:-30}
      # taille maximale d'un projet (images comprises), en Mo
      CIDER_MAX_PROJECT_MB: ${CIDER_MAX_PROJECT_MB:-200}
      # nombre maximal de projets par utilisateur
      CIDER_MAX_PROJECTS_PER_USER: ${CIDER_MAX_PROJECTS_PER_USER:-100}
      # code de création du premier administrateur ; vide = code aléatoire affiché dans les logs
      CIDER_SETUP_TOKEN: ${CIDER_SETUP_TOKEN:-}
      # "true" quand l'application est servie en HTTPS (cookie de session Secure)
      CIDER_COOKIE_SECURE: ${CIDER_COOKIE_SECURE:-auto}
      # --- IA : génération d'images (un service est actif dès que sa clé ou son URL est renseignée)
      # service proposé par défaut : openai, gemini ou comfyui
      CIDER_IMAGE_PROVIDER: ${CIDER_IMAGE_PROVIDER:-}
      # quota mensuel attribué aux nouveaux comptes (modifiable par compte dans l'administration)
      CIDER_AI_DEFAULT_MONTHLY_IMAGES: ${CIDER_AI_DEFAULT_MONTHLY_IMAGES:-50}
      # délai maximal d'une génération, en secondes (moins de 300)
      CIDER_AI_TIMEOUT_SECONDS: ${CIDER_AI_TIMEOUT_SECONDS:-180}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2}
      OPENAI_IMAGE_QUALITY: ${OPENAI_IMAGE_QUALITY:-medium}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-3.1-flash-image}
      # ComfyUI local, ex. http://192.168.1.20:8188
      COMFYUI_URL: ${COMFYUI_URL:-}
      COMFYUI_CHECKPOINT: ${COMFYUI_CHECKPOINT:-sd_xl_base_1.0.safetensors}
      # workflow personnalisé (format API), placé dans le dossier de données, ex. /data/comfyui-workflow.json
      COMFYUI_WORKFLOW_FILE: ${COMFYUI_WORKFLOW_FILE:-}
    volumes:
      # dossier de l'hôte où sont stockés comptes et projets
      - ${CIDER_DATA_PATH:-./data}:/data
