# Construire les images sur place au lieu de les télécharger (développement,
# ou version modifiée localement) :
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: cider-ia-web:local
    pull_policy: build
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: cider-ia-api:local
    pull_policy: build
